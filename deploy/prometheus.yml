global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'rtdwh-backend'
    metrics_path: '/api/v1/actuator/prometheus'
    static_configs:
      - targets: ['rtdwh-backend:8080']

  - job_name: 'flink-jobmanager'
    static_configs:
      - targets: ['flink-jobmanager:8081']

  - job_name: 'flink-taskmanager'
    static_configs:
      - targets: ['flink-taskmanager:6123']

version: '3.8'

services:
  # MySQL - 管理库元数据存储
  mysql:
    image: mysql:8.0
    container_name: rtdwh-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_DATABASE: rtdwh_mgmt
      MYSQL_USER: ${MYSQL_USER:-rtdwh_admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../scripts/init-mysql.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rtdwh-backend

  # PostgreSQL - 可选业务源库示例
  postgresql:
    image: postgres:13
    container_name: rtdwh-postgresql
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: ${PG_USER:-rtdwh_admin}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-rtdwh_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rtdwh-backend

  # Flink JobManager
  flink-jobmanager:
    image: flink:1.19.1-java17
    container_name: rtdwh-flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - FLINK_PROPERTIES=jobmanager.rpc.address:flink-jobmanager
    volumes:
      - flink_data:/opt/flink/data
    restart: unless-stopped
    networks:
      - rtdwh-backend

  # Flink TaskManager
  flink-taskmanager:
    image: flink:1.19.1-java17
    container_name: rtdwh-flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - FLINK_PROPERTIES=jobmanager.rpc.address:flink-jobmanager
      - FLINK_PROPERTIES=taskmanager.numberOfTaskSlots:4
    volumes:
      - flink_data:/opt/flink/data
    deploy:
      replicas: 2
    restart: unless-stopped
    networks:
      - rtdwh-backend

  # Spring Boot Management Backend
  rtdwh-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: rtdwh-backend
    ports:
      - "8080:8080"
    environment:
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_USERNAME=${DB_USERNAME:-rtdwh_admin}
      - FLINK_REST_URL=http://flink-jobmanager:8081
      - FLINK_JAR_PATH=/opt/flink/usrlib
      - FLINK_SAVEPOINT_DIR=/tmp/flink-savepoints
      - PAIMON_WAREHOUSE=/data/paimon
      - PAIMON_JDBC_PASSWORD=${PAIMON_JDBC_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - INIT_USERS_ENABLED=${INIT_USERS_ENABLED:-false}
      - MAIL_HOST=${MAIL_HOST:-}
      - DINGTALK_WEBHOOK=${DINGTALK_WEBHOOK:-}
      - WECOM_WEBHOOK=${WECOM_WEBHOOK:-}
      - ALERT_EMAIL_RECIPIENTS=${ALERT_EMAIL_RECIPIENTS:-}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rtdwh-backend
      - rtdwh-frontend

  # Nginx Reverse Proxy (Frontend + Backend)
  rtdwh-nginx:
    image: nginx:alpine
    container_name: rtdwh-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - rtdwh-backend
    restart: unless-stopped
    networks:
      - rtdwh-frontend

  # Prometheus (optional - monitoring)
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: rtdwh-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../deploy/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    networks:
      - rtdwh-backend

  # Grafana (optional - visualization)
  grafana:
    image: grafana/grafana:11.0.0
    container_name: rtdwh-grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    networks:
      - rtdwh-backend

volumes:
  mysql_data:
  pg_data:
  flink_data:
  prometheus_data:
  grafana_data:

networks:
  rtdwh-backend:
    driver: bridge
  rtdwh-frontend:
    driver: bridge

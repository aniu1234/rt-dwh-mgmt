<rect x="810" y="72" width="120" height="95" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="870" y="92" text-anchor="middle" fill="#6b7280" font-size="9" font-weight="600">图例</text>
<line x1="822" y1="108" x2="852" y2="108" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<text x="858" y="112" fill="#6b7280" font-size="8">HTTP请求流</text>
<line x1="822" y1="124" x2="852" y2="124" stroke="#dc2626" stroke-width="1.2"/>
<text x="858" y="128" fill="#6b7280" font-size="8">JDBC/内部连接</text>
<line x1="822" y1="140" x2="852" y2="140" stroke="#ea580c" stroke-width="1.2"/>
<text x="858" y="144" fill="#6b7280" font-size="8">Flink REST API</text>
<rect x="822" y="148" width="30" height="8" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
<text x="858" y="156" fill="#6b7280" font-size="8">外部可访问</text>

